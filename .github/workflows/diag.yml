name: Diagnostika zdrojů
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/diag*"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - run: node scripts/diag.mjs
      - run: |
          git config user.name "Pstruh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag && git commit -m "Diagnostika zdrojů" && git pull --rebase && git push || true
