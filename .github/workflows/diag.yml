name: Diagnostika revírů
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/diag*"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/diag.mjs
      - run: |
          git config user.name "Pstruh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diag.json && git commit -m "Diagnostika" && git pull --rebase && git push || true
